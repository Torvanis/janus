# Built-in secret detection rules for the Security Gateway.
#
# Schema (mirrors gitleaks):
#   id           unique rule id, used in "[REDACTED:<id>]" replacements
#   description  human-readable summary
#   regex        Go RE2 regular expression (no backtracking, no lookaround)
#   keywords     case-insensitive substrings; the regex only runs if at least
#                one occurs in the text (a rule with no keywords always runs)
#   secretGroup  capture group holding the secret; 0 = whole match
#   entropy      minimum Shannon entropy (bits/byte) of the secret; 0 = none
#   severity     low | medium | high | critical
#   enabled      default true
#   maxSpan      longest secret span the rule can produce (default 1024)
#   endRegex     optional; extends the span from the match start to the end of
#                the first endRegex hit within maxSpan (multi-line blocks)
#   [rules.allowlist]
#     regexes    a secret matching any of these is suppressed
#     stopwords  a secret containing any of these (case-insensitive) is suppressed
#
# Regexes use TOML literal strings ('...' or '''...''') so backslashes are
# taken verbatim.

[[rules]]
id = "aws-access-key-id"
description = "AWS access key ID"
regex = '\b(?:AKIA|ASIA)[A-Z0-9]{16}\b'
keywords = ["akia", "asia"]
severity = "critical"

[[rules]]
id = "aws-secret-key"
description = "AWS secret access key assigned in context"
regex = '''(?i)(?:aws[_\-]?)?secret[_\-]?(?:access[_\-]?)?key\s*["']?\s*[:=]\s*["']?([A-Za-z0-9/+=]{40})(?:[^A-Za-z0-9/+=]|$)'''
keywords = ["secret"]
secretGroup = 1
entropy = 3.5
severity = "critical"
[rules.allowlist]
stopwords = ["example", "xxxxxxxx"]

[[rules]]
id = "github-pat"
description = "GitHub personal access / OAuth / app token"
regex = '\b(?:ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36,255}\b'
keywords = ["ghp_", "gho_", "ghu_", "ghs_", "ghr_"]
severity = "critical"

[[rules]]
id = "github-fine-grained"
description = "GitHub fine-grained personal access token"
regex = '\bgithub_pat_[A-Za-z0-9_]{22,255}\b'
keywords = ["github_pat_"]
severity = "critical"

[[rules]]
id = "gitlab-pat"
description = "GitLab personal access token"
regex = '\bglpat-[A-Za-z0-9_\-]{20,}\b'
keywords = ["glpat-"]
severity = "critical"

[[rules]]
id = "slack-token"
description = "Slack bot/user/app token"
regex = '\bxox[baprs]-[0-9]{8,13}-[0-9A-Za-z\-]{20,}\b'
keywords = ["xoxb-", "xoxa-", "xoxp-", "xoxr-", "xoxs-"]
severity = "high"

[[rules]]
id = "slack-webhook"
description = "Slack incoming webhook URL"
regex = 'https://hooks\.slack\.com/services/T[A-Z0-9]{8,}/B[A-Z0-9]{8,}/[A-Za-z0-9]{20,}'
keywords = ["hooks.slack.com"]
severity = "high"

[[rules]]
id = "stripe"
description = "Stripe live secret or restricted key"
regex = '\b(?:sk|rk)_live_[A-Za-z0-9]{20,}\b'
keywords = ["sk_live_", "rk_live_"]
severity = "critical"

[[rules]]
id = "openai-api-key"
description = "OpenAI API key"
regex = '\bsk-(?:proj-)?[A-Za-z0-9_\-]{20,}\b'
keywords = ["sk-"]
severity = "high"
[rules.allowlist]
regexes = ['^sk-ant-']

[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '\bsk-ant-[A-Za-z0-9_\-]{20,}\b'
keywords = ["sk-ant-"]
severity = "high"

[[rules]]
id = "google-api-key"
description = "Google API key"
regex = '\bAIza[0-9A-Za-z_\-]{35}\b'
keywords = ["aiza"]
severity = "high"

[[rules]]
id = "gcp-service-account"
description = "GCP service account JSON credential"
regex = '"type"\s*:\s*"service_account"'
keywords = ["service_account"]
severity = "critical"

[[rules]]
id = "azure-storage-key"
description = "Azure storage account key in a connection string"
regex = '(?i)AccountKey=([A-Za-z0-9+/=]{86,88})'
keywords = ["accountkey="]
secretGroup = 1
severity = "critical"

[[rules]]
id = "private-key"
description = "PEM-encoded private key block"
regex = '-----BEGIN (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----'
endRegex = '-----END (?:RSA |EC |DSA |OPENSSH |PGP |ENCRYPTED )?PRIVATE KEY(?: BLOCK)?-----'
keywords = ["private key"]
maxSpan = 4160
severity = "critical"

[[rules]]
id = "jwt"
description = "JSON Web Token"
regex = '\beyJ[A-Za-z0-9_\-]{10,}\.eyJ[A-Za-z0-9_\-]{10,}\.[A-Za-z0-9_\-]{10,}\b'
keywords = ["eyj"]
severity = "high"

[[rules]]
id = "connection-string-uri"
description = "Database/broker URI with embedded password"
regex = '(?i)\b(?:postgres|postgresql|mysql|mongodb(?:\+srv)?|redis|amqp)://[^\s:/@]+:([^\s@/]+)@[^\s]+'
keywords = ["://"]
secretGroup = 1
severity = "critical"
[rules.allowlist]
stopwords = ["password", "example", "changeme", "placeholder", "xxxxxxxx", "your_password", "secret"]

[[rules]]
id = "sendgrid"
description = "SendGrid API key"
regex = '\bSG\.[A-Za-z0-9_\-]{22}\.[A-Za-z0-9_\-]{43}\b'
keywords = ["sg."]
severity = "high"

[[rules]]
id = "twilio"
description = "Twilio API key SID"
regex = '\bSK[0-9a-f]{32}\b'
keywords = ["sk"]
severity = "high"

[[rules]]
id = "npm-token"
description = "npm access token"
regex = '\bnpm_[A-Za-z0-9]{36}\b'
keywords = ["npm_"]
severity = "high"

[[rules]]
id = "pypi-token"
description = "PyPI upload token"
regex = '\bpypi-AgEIcHlwaS5vcmc[A-Za-z0-9_\-]{50,}'
keywords = ["pypi-ageichlwas5vcmc"]
severity = "high"

[[rules]]
id = "heroku"
description = "Heroku API key assigned in context"
regex = '''(?i)heroku[a-z0-9_\-\s"']{0,24}[:=]\s*["']?([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})\b'''
keywords = ["heroku"]
secretGroup = 1
severity = "high"

[[rules]]
id = "mailchimp"
description = "Mailchimp API key"
regex = '\b[0-9a-f]{32}-us[0-9]{1,2}\b'
keywords = ["-us"]
severity = "high"

[[rules]]
id = "hashicorp-vault-token"
description = "HashiCorp Vault service or batch token"
regex = '\b(?:hvs\.[A-Za-z0-9_\-]{24,}|s\.[A-Za-z0-9]{24})\b'
keywords = ["hvs.", "s."]
severity = "critical"

[[rules]]
id = "telegram-bot-token"
description = "Telegram bot token"
regex = '\b[0-9]{8,10}:AA[A-Za-z0-9_\-]{33}\b'
keywords = [":aa"]
severity = "high"

[[rules]]
id = "discord-bot-token"
description = "Discord bot token (needs discord/bot context)"
regex = '\b[MN][A-Za-z0-9_\-]{23,}\.[A-Za-z0-9_\-]{6}\.[A-Za-z0-9_\-]{27,}\b'
keywords = ["discord", "bot"]
severity = "high"

[[rules]]
id = "generic-password-assignment"
description = "Password assigned to a variable or config key"
regex = '''(?i)(password|passwd|pwd)\s*[=:]\s*['"]?([^\s'"]{8,})'''
keywords = ["password", "passwd", "pwd"]
secretGroup = 2
entropy = 3.0
severity = "medium"
[rules.allowlist]
stopwords = ["password", "example", "changeme", "placeholder", "xxxxxxxx", "your_password"]

# Disabled by default: matches "api_key = <16+ chars>" style assignments, which
# in conversational prose (documentation excerpts, code review discussions,
# placeholders) produces far more noise than signal. Enable per-tenant when
# the traffic is code-heavy and the false-positive cost is acceptable.
[[rules]]
id = "generic-api-key"
description = "Generic API key assignment (prose-noisy; disabled by default)"
regex = '''(?i)(?:api[_\-]?key|apikey|api[_\-]?secret|access[_\-]?token)\s*['"]?\s*[:=]\s*['"]?([A-Za-z0-9_\-]{16,})'''
keywords = ["api", "access_token", "access-token", "accesstoken"]
secretGroup = 1
entropy = 3.5
severity = "low"
enabled = false
[rules.allowlist]
stopwords = ["example", "placeholder", "xxxxxxxx", "your_api_key", "changeme"]
