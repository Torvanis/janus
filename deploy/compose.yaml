name: janus
services:
  janus:
    image: janus:2026.9.4
    build:
      context: ..
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      JANUS_ENCRYPTION_KEY: ${JANUS_ENCRYPTION_KEY:?Run python3 scripts/init-env.py first}
      JANUS_DATABASE_URL: sqlite:///data/janus.db
      JANUS_PUBLIC_URL: http://127.0.0.1:8080
      JANUS_LISTEN_ADDR: :8080
      JANUS_DEV_AUTH: "false"
      JANUS_COOKIE_SECURE: "false"
      JANUS_ENV: production
    volumes:
      - janus-data:/data
    user: "65532:65532"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, /janus, --health-probe]
      interval: 30s
      timeout: 6s
      start_period: 30s
      retries: 3
volumes:
  janus-data:
