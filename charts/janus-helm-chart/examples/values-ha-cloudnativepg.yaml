# High-availability example: three gateway replicas on a CloudNativePG cluster.
# See README.md "High availability with CloudNativePG" for the Cluster manifest
# and the Secrets this file expects. Pre-create in the release namespace:
#   janus-key      encryption key (64 hex characters), key JANUS_ENCRYPTION_KEY
#   janus-license  license file, key license (three replicas = three licensed nodes)
#   janus-tls      ingress TLS certificate (kubernetes.io/tls)
# CloudNativePG creates janus-db-app (key password) and janus-db-ca (key ca.crt)
# for a Cluster named janus-db.
#
# helm install janus <chart> -n janus -f values-ha-cloudnativepg.yaml
replicaCount: 3
publicURL: https://janus.example.com
encryptionKey:
  existingSecret: janus-key
license:
  existingSecret: janus-license
postgresql:
  enabled: false
externalPostgresql:
  host: janus-db-rw          # CloudNativePG read-write Service; follows the primary
  port: 5432
  database: janus            # Cluster bootstrap.initdb.database / owner
  username: janus
  existingSecret: janus-db-app
  passwordKey: password
  sslMode: verify-full
  caSecret: janus-db-ca
  caKey: ca.crt
podDisruptionBudget:
  enabled: true
  maxUnavailable: 1
topologySpread:
  enabled: true
  hostname: ScheduleAnyway   # soft: a drained node's pod can land on a survivor
  zone: ""                   # ScheduleAnyway on multi-zone clusters
lifecycle:
  preStopSleepSeconds: 10    # Kubernetes >= 1.30; ignored (with a NOTES warning) below
terminationGracePeriodSeconds: 50   # 10 s preStop + 30 s Janus drain + margin
# The ingress controller pods are the proxy in front of Janus. List their
# addresses (often the pod CIDR, e.g. 10.42.0.0/16 on k3s) to log real client IPs.
trustedProxies: []
ingress:
  enabled: true
  className: traefik
  host: janus.example.com
  tls:
    - secretName: janus-tls
      hosts: [janus.example.com]
