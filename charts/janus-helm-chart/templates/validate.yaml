{{- if not .Values.encryptionKey.existingSecret -}}
{{- fail "encryptionKey.existingSecret is required; create and back up a 64-hex-character encryption key before installing" -}}
{{- end -}}
{{- if eq .Values.database.type "sqlite" -}}
{{- if ne (int .Values.replicaCount) 1 -}}
{{- fail "SQLite requires replicaCount=1; multiple writers are unsafe" -}}
{{- end -}}
{{- if .Values.postgresql.enabled -}}
{{- fail "SQLite requires postgresql.enabled=false" -}}
{{- end -}}
{{- else if .Values.postgresql.enabled -}}
{{- if not .Values.postgresql.existingSecret -}}
{{- fail "postgresql.existingSecret is required for bundled PostgreSQL; credentials must survive upgrades and PVC restores" -}}
{{- end -}}
{{- if .Values.externalPostgresql.host -}}
{{- fail "externalPostgresql.host and postgresql.enabled=true are mutually exclusive" -}}
{{- end -}}
{{- else -}}
{{- if or (not .Values.externalPostgresql.host) (not .Values.externalPostgresql.existingSecret) -}}
{{- fail "external PostgreSQL requires externalPostgresql.host and externalPostgresql.existingSecret" -}}
{{- end -}}
{{- end -}}
{{- if and .Values.ingress.enabled (not .Values.ingress.host) -}}
{{- fail "ingress.host is required when ingress.enabled=true" -}}
{{- end -}}
{{- if and .Values.ingress.enabled (not (hasPrefix "https://" .Values.publicURL)) -}}
{{- fail "Ingress requires an HTTPS publicURL; complete bootstrap privately before enabling ingress" -}}
{{- end -}}
{{- if and .Values.serviceMonitor.enabled (not (.Capabilities.APIVersions.Has "monitoring.coreos.com/v1/ServiceMonitor")) -}}
{{- fail "serviceMonitor.enabled requires the monitoring.coreos.com/v1/ServiceMonitor CRD" -}}
{{- end -}}
{{- if and .Values.serviceMonitor.enabled (not .Values.metrics.enabled) -}}
{{- fail "serviceMonitor.enabled requires metrics.enabled=true" -}}
{{- end -}}
{{- $reserved := list "JANUS_ENCRYPTION_KEY" "JANUS_DATABASE_URL" "JANUS_PUBLIC_URL" "JANUS_LISTEN_ADDR" "JANUS_METRICS_ADDR" "JANUS_ENV" "JANUS_DEV_AUTH" "JANUS_DEV_AUTH_ALLOW_UNSAFE" "JANUS_COOKIE_SECURE" "JANUS_LICENSE_FILE" -}}
{{- range $settings := list .Values.extraEnv .Values.secretEnv -}}
{{- range $key, $value := $settings -}}
{{- if or (has $key $reserved) (hasPrefix "PG" $key) -}}
{{- fail (printf "%s is chart-managed or reserved; use the dedicated values instead" $key) -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{- range $key, $value := .Values.extraEnv -}}
{{- if hasKey $.Values.secretEnv $key -}}
{{- fail (printf "%s appears in both extraEnv and secretEnv" $key) -}}
{{- end -}}
{{- end -}}
{{- if and .Values.trustedProxies (or (hasKey .Values.extraEnv "JANUS_TRUSTED_PROXIES") (hasKey .Values.secretEnv "JANUS_TRUSTED_PROXIES")) -}}
{{- fail "set trusted proxies through trustedProxies or JANUS_TRUSTED_PROXIES in extraEnv/secretEnv, not both" -}}
{{- end -}}
{{- range $value, $env := dict "shutdown.delaySeconds" "JANUS_SHUTDOWN_DELAY" "shutdown.graceSeconds" "JANUS_SHUTDOWN_GRACE" "database.connectTimeoutSeconds" "JANUS_DB_CONNECT_TIMEOUT" -}}
{{- $parts := splitList "." $value -}}
{{- if and (not (kindIs "invalid" (index $.Values (index $parts 0) (index $parts 1)))) (or (hasKey $.Values.extraEnv $env) (hasKey $.Values.secretEnv $env)) -}}
{{- fail (printf "set %s through %s or extraEnv/secretEnv, not both" $env $value) -}}
{{- end -}}
{{- end -}}
{{- $delay := 0 -}}
{{- if not (kindIs "invalid" .Values.shutdown.delaySeconds) -}}{{- $delay = int .Values.shutdown.delaySeconds -}}{{- end -}}
{{- $grace := 30 -}}
{{- if not (kindIs "invalid" .Values.shutdown.graceSeconds) -}}{{- $grace = int .Values.shutdown.graceSeconds -}}{{- end -}}
{{- $needed := add (int .Values.lifecycle.preStopSleepSeconds) $delay $grace 5 -}}
{{- if le (int .Values.terminationGracePeriodSeconds) (int $needed) -}}
{{- fail (printf "terminationGracePeriodSeconds (%d) must exceed lifecycle.preStopSleepSeconds + shutdown.delaySeconds + shutdown.graceSeconds (30 when unset) + 5 = %d" (int .Values.terminationGracePeriodSeconds) (int $needed)) -}}
{{- end -}}
