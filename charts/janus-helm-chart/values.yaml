# Required: pre-create Secrets in the release namespace. This chart never
# generates or stores credentials in Helm release values. See README.md.
replicaCount: 1
nameOverride: ""
fullnameOverride: ""
image:
  repository: ghcr.io/torvanis/janus
  tag: "2026.11.2"
  digest: sha256:ec74d8c442c564a04f9cb791458f7fe28bc5c73045a6bec5d35235d614bf4bba
  pullPolicy: IfNotPresent
imagePullSecrets: []
# Loopback evaluation by default. Set an HTTPS origin before remote exposure.
publicURL: http://127.0.0.1:8080
encryptionKey:
  existingSecret: ""
  key: JANUS_ENCRYPTION_KEY
license:
  existingSecret: ""
  key: license
# Choose ONE mode:
# 1. Bundled PostgreSQL (DEFAULT): type=postgresql, postgresql.enabled=true;
#    supply postgresql.existingSecret. Creates exactly one PostgreSQL instance.
# 2. Existing PostgreSQL: type=postgresql, postgresql.enabled=false;
#    supply externalPostgresql.host and externalPostgresql.existingSecret.
# 3. Local SQLite (EVALUATION ONLY): type=sqlite, postgresql.enabled=false,
#    replicaCount=1; uses the persistent claim configured under sqlite below.
# Every mode also requires encryptionKey.existingSecret.
database:
  type: postgresql
postgresql:
  enabled: true
  image: postgres:16-alpine
  # Exactly one StatefulSet replica; no operator dependency or HA claims.
  database: janus
  username: janus
  existingSecret: ""
  passwordKey: password
  persistence:
    size: 10Gi
    storageClass: null
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
externalPostgresql:
  host: ""
  port: 5432
  database: janus
  username: janus
  existingSecret: ""
  passwordKey: password
  sslMode: verify-full
  # Optional Secret containing ca.crt (or caKey); verify-full needs a trusted CA.
  caSecret: ""
  caKey: ca.crt
# EVALUATION ONLY. Never scale or share this PVC with another writer.
sqlite:
  persistence:
    existingClaim: ""
    size: 10Gi
    storageClass: null
service:
  port: 8080
# Prometheus metrics. Janus serves GET /metrics on a port of its own
# (JANUS_METRICS_ADDR), never on the http port, so the Ingress cannot expose
# them. The ClusterIP Service publishes it as port "metrics" for scraping.
# Metrics name every upstream and model and carry usage and spend totals:
# keep the port inside the cluster. enabled: false turns the listener off.
metrics:
  enabled: true
  port: 9464
ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
serviceMonitor:
  enabled: false
  labels: {}
  interval: 30s
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {memory: 1Gi}
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
# High availability. More gateway replicas only help when PostgreSQL is also
# redundant (external, e.g. CloudNativePG); see README "High availability with
# CloudNativePG". "auto" turns a feature on only when replicaCount > 1, so a
# single-replica install renders exactly as before; true/false force it.
podDisruptionBudget:
  enabled: auto
  # Integer or percentage. Prefer maxUnavailable over minAvailable: it still
  # lets a node drain proceed when another gateway pod is already Pending.
  maxUnavailable: 1
topologySpread:
  enabled: auto
  # whenUnsatisfiable per topology key: ScheduleAnyway, DoNotSchedule, or ""
  # (no constraint for that key). Soft hostname spread lets a drained node's pod
  # land on a surviving node instead of staying Pending.
  hostname: ScheduleAnyway
  # Set on multi-zone clusters (topology.kubernetes.io/zone).
  zone: ""
# Raw topologySpreadConstraints; when non-empty they replace the generated ones.
topologySpreadConstraints: []
lifecycle:
  # Seconds the pod keeps serving after it is marked Terminating, so Service
  # endpoints and the ingress stop routing to it before Janus drains. Uses the
  # native preStop sleep action (the image has no shell) and is rendered only on
  # Kubernetes >= 1.30. 0 = off.
  preStopSleepSeconds: 0
# Must exceed preStopSleepSeconds plus Janus' own 30-second request drain.
terminationGracePeriodSeconds: 45
# IPs or CIDRs of the reverse proxies (for example ingress-controller pods) whose
# X-Forwarded-For Janus trusts for the client address. Sets
# JANUS_TRUSTED_PROXIES. Never list 0.0.0.0/0.
trustedProxies: []
# Map of additional literal app settings. Secrets belong in secretEnv instead.
# Chart-managed env (database, encryption, auth safety, listen URL) cannot be overridden.
extraEnv: {}
# Map: ENV_NAME: {name: existing-secret, key: secret-key}
secretEnv: {}
